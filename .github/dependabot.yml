version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # egui/eframe 0.37 меняет публичные типы (FontDefinitions из своей
      # копии egui, WidgetType → Role и др.) — требует отдельного
      # рефакторинга, поэтому предложения 0.37+ игнорируются.
      - dependency-name: "eframe"
        versions: [">=0.37.0"]
      - dependency-name: "egui"
        versions: [">=0.37.0"]
