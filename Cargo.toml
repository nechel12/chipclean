[package]
name = "chipclean"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast, safe Windows cleaner and registry optimizer"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
] }
egui = "0.36"
egui-phosphor = "0.14"
glob = "0.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
single-instance = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Services",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.100"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
